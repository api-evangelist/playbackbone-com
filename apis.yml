description: 'Backbone sells handheld gaming controllers and devices, such as the Backbone Pro and Backbone One, along with the Backbone App that lets gamers play mobile, console, and PC games on their phones or stream from cloud services. The products target gamers who want portable, low‑latency control for services like Xbox Cloud Gaming, PlayStation Remote Play, Steam Link, Apple Arcade, and NVIDIA GeForce NOW.'

